name: Test

on:
  push:
    branches: [main, v3]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.24 is the oldest supported Go; Go's minimal version selection
        # already builds against the lowest declared dependency versions.
        go: ['1.24', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Verify modules
        run: go mod verify
      - name: Contract kit matches its MANIFEST
        run: go run ./internal/tools/synckit -check
      - name: Vet
        run: go vet ./... && go vet -tags integration ./...
      - name: Build the examples
        run: go build ./examples/...
      - name: Unit, conformance, example and README tests
        # Live tests sit behind the integration build tag and never run here.
        run: go test -race -count=1 ./...
      - name: Library code does not use the kit or local files
        run: |
          if git ls-files | grep -E '^local/'; then echo "local/ must not be committed"; exit 1; fi
          if grep -l 'testdata' $(git ls-files '*.go' | grep -v '_test.go$' | grep -v '^internal/tools/'); then
            echo "library code references testdata"; exit 1
          fi

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      # The gitleaks GitHub Action needs a paid license for organization
      # repositories; the CLI does not. .gitleaks.toml allowlists the
      # synthetic keys of the contract kit and the tests.
      - name: Secret scan
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.21.2
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --verbose .
      - name: No AI attribution in commit messages
        run: |
          if git log --format=%B | grep -inE 'co-authored-by|generated (with|by)|\bclaude\b|anthropic'; then
            echo "commit messages must not carry AI attribution"; exit 1
          fi
