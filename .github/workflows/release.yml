name: Release

# For Go modules the git tag IS the release — no publish step needed.
# This workflow gates the tag on a green test run and creates a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Test
        run: go test -race ./...
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Go has no registry to upload to — proxy.golang.org pulls the module
      # from GitHub on first request. This step makes that request immediately
      # so the version is cached on the proxy and indexed on pkg.go.dev right
      # away instead of waiting for the first user's `go get`.
      - name: Trigger Go proxy indexing
        run: curl -sf "https://proxy.golang.org/github.com/callbk/finlight-client-go/@v/${GITHUB_REF_NAME}.info"
